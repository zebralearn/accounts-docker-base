name: Build and Push Docker Image

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

permissions:
    contents: read
    packages: write

jobs:
    docker:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: linux/amd64
                      platform_suffix: amd64
                    - platform: linux/arm64
                      platform_suffix: arm64

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract Docker metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/zebralearn/accounts-docker-base
                  tags: |
                      type=raw,value=latest-${{ matrix.platform_suffix }},enable={{is_default_branch}}
                      type=ref,event=tag,suffix=-${{ matrix.platform_suffix }}
                      type=sha,suffix=-${{ matrix.platform_suffix }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./Dockerfile
                  platforms: ${{ matrix.platform }}
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
